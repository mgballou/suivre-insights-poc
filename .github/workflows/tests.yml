name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          behind=$(gh api "repos/${{ github.repository }}/compare/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" --jq .behind_by)
          if [ "$behind" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::This branch is $behind commits behind ${{ github.base_ref }}. Update it to run CI."; echo "run=false" >> "$GITHUB_OUTPUT"; fi

  pytest:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The notebook and the pinned freeze were produced on 3.14; 3.12 is the
        # floor pyproject.toml claims, so both get exercised.
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Not the pinned freeze: that exists to reproduce the notebook's figures
      # and drags in the whole Jupyter stack to do it. The tests need only the
      # package and pytest.
      - run: pip install -e . pytest

      - run: pytest -q
