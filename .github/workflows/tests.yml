name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The notebook and the pinned freeze were produced on 3.14; 3.12 is the
        # floor pyproject.toml claims, so both get exercised.
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Not the pinned freeze: that exists to reproduce the notebook's figures
      # and drags in the whole Jupyter stack to do it. The tests need only the
      # package and pytest.
      - run: pip install -e . pytest

      - run: pytest -q
