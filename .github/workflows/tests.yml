name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  # A PR behind its base passes the gate and skips the tests with a notice; a
  # stale branch is not a failure.
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This branch is $behind commits behind $BASE. Update it to run CI."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        # The notebook and the pinned freeze were produced on 3.14; 3.12 is the
        # floor pyproject.toml claims, so both get exercised.
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Not the pinned freeze: that exists to reproduce the notebook's figures
      # and drags in the whole Jupyter stack to do it. The tests need only the
      # package and pytest.
      - run: pip install -e . pytest

      - run: pytest -q
