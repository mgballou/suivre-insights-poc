[project]
name = "insights"
version = "0.1.0"
description = "Simulation study of the lag-lift food/symptom correlation behind Suivre"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
